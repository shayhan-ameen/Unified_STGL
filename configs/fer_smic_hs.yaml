_base_: base.yaml
exp_name: fer_smic_hs

data:
  task: fer
  dataset: smic_hs
  root: data/processed/smic_hs
  protocol: loso              # leave-one-subject-out
  num_classes: 3              # positive, negative, surprise
  num_nodes: 51
  num_keyframes: 8
  patch_size: 7
  augment: true

model:
  encoder: face
  dropout: 0.3

train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  epochs: 100
  batch_size: 32
