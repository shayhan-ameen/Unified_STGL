_base_: base.yaml
exp_name: fer_oulu_vl

data:
  task: fer
  dataset: oulu_vl
  root: data/processed/oulu_vl
  protocol: kfold             # subject-independent 10-fold cross-validation
  num_folds: 10
  num_classes: 6              # anger, disgust, fear, happiness, sadness, surprise
  num_nodes: 51
  num_keyframes: 8
  patch_size: 7
  augment: true

model:
  encoder: face
  dropout: 0.3

train:
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  epochs: 100
  batch_size: 32
